# Production compose file for the Lightsail host.
#
# Lives at /opt/book_reservation/docker-compose.yml — the deploy workflow
# copies it there on every deploy so the server always matches the repo.
#
# IMAGE and HOST_PORT are interpolated from /opt/book_reservation/.env;
# deploy/deploy.sh pins IMAGE to the exact release tag being deployed, so a
# plain `docker compose up -d` on the server always restores the version
# that was last released — never an unvetted `latest`.

services:
  web:
    image: "${IMAGE:?IMAGE is set by deploy.sh — run a deploy first}"
    container_name: book_reservation
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file: .env
    volumes:
      # SQLite database (with WAL sidecar files) and media uploads.
      - ./data:/data
