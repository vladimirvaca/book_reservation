# Production compose file for the Lightsail host.
#
# Lives at /opt/book_reservation/docker-compose.yml — the deploy workflow
# copies it there on every deploy so the server always matches the repo.
# The .env next to it is rendered from GitHub secrets/vars by the same
# workflow; nothing on the server is maintained by hand.
#
# IMAGE and HOST_PORT are interpolated from that .env. deploy/deploy.sh
# pins IMAGE to the exact release tag being deployed, so a plain
# `docker compose up -d` on the server always restores the version that
# was last released — never an unvetted `latest`.

services:
  web:
    image: "${IMAGE:?IMAGE is pinned by deploy.sh — run a deploy first}"
    container_name: book_reservation
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file: .env
    volumes:
      # SQLite database (with WAL sidecar files) and media uploads.
      - ./data:/data
    healthcheck:
      # Mirrors the Dockerfile HEALTHCHECK so `docker compose ps` reports
      # health; requires 127.0.0.1 in DJANGO_ALLOWED_HOSTS (the rendered
      # .env always includes it).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      # Cap log disk usage on the small instance.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
