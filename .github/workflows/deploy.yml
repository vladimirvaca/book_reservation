# Deploys a released image to the AWS Lightsail instance over SSH.
#
# Called automatically by release.yml after each release, or run manually
# from the Actions tab (workflow_dispatch) to redeploy / roll back any
# previously published version.
#
# Required repository secrets:
#   LIGHTSAIL_HOST     — public IP or hostname of the instance
#   LIGHTSAIL_USER     — SSH user (e.g. ubuntu)
#   LIGHTSAIL_SSH_KEY  — private key (PEM) authorized on the instance
#   DJANGO_SECRET_KEY  — production Django secret key
# Optional secrets:
#   LIGHTSAIL_PORT     — SSH port, defaults to 22
# Repository variables (Settings → Secrets and variables → Variables):
#   DJANGO_ALLOWED_HOSTS         — e.g. books.example.com (127.0.0.1 and
#                                  localhost are appended automatically for
#                                  the container health checks)
#   DJANGO_CSRF_TRUSTED_ORIGINS  — optional, e.g. https://books.example.com
#   HOST_PORT                    — optional host port, defaults to 8000
#
# The production .env is rendered from these on every deploy and copied to
# the server — nothing is configured by hand on the instance.
name: Deploy

on:
  workflow_call:
    inputs:
      version:
        description: "Image tag to deploy (e.g. v1.2.3)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (e.g. v1.2.3)"
        required: true
        type: string

# Never run two deploys against the server at once; queue instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to Lightsail
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      SSH_USER: ${{ secrets.LIGHTSAIL_USER }}
      SSH_PORT: ${{ secrets.LIGHTSAIL_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Render production .env
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
          DJANGO_CSRF_TRUSTED_ORIGINS: ${{ vars.DJANGO_CSRF_TRUSTED_ORIGINS }}
          HOST_PORT: ${{ vars.HOST_PORT }}
        run: |
          if [ -z "$DJANGO_SECRET_KEY" ]; then
            echo "::error::DJANGO_SECRET_KEY secret is not set."
            exit 1
          fi
          {
            echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
            echo "DJANGO_DEBUG=False"
            # 127.0.0.1/localhost are required by the Docker HEALTHCHECK and
            # the deploy smoke test; duplicates are harmless to Django.
            echo "DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:+$DJANGO_ALLOWED_HOSTS,}127.0.0.1,localhost"
            if [ -n "$DJANGO_CSRF_TRUSTED_ORIGINS" ]; then
              echo "DJANGO_CSRF_TRUSTED_ORIGINS=$DJANGO_CSRF_TRUSTED_ORIGINS"
            fi
            if [ -n "$HOST_PORT" ]; then
              echo "HOST_PORT=$HOST_PORT"
            fi
          } > production.env

      - name: Copy compose file and .env to server
        run: |
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            deploy/docker-compose.yml \
            "$SSH_USER@$SSH_HOST:/opt/book_reservation/docker-compose.yml"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            production.env \
            "$SSH_USER@$SSH_HOST:/opt/book_reservation/.env"

      - name: Run deploy script on server
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.version }}
          APP_VERSION: ${{ inputs.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "IMAGE='$IMAGE' APP_VERSION='$APP_VERSION' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" \
            < deploy/deploy.sh
