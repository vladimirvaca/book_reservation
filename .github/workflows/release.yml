# Release pipeline — fires when a version tag (v1.2.3) is pushed.
#
#   verify (lint + tests) → docker → github-release
#
# 1. verify          — tag must match the VERSION file; pylint, isort and
#                      the full test suite must pass or nothing is published.
# 2. docker          — image pushed to GHCR tagged v1.2.3 + latest, with
#                      OCI labels (version, revision, source, …) baked in.
#                      Containers inherit image labels, so tools like
#                      Traefik can read them off the running container.
# 3. github-release  — GitHub Release with a commit-level changelog since
#                      the previous tag and a source tarball artifact.
#
# Deployment is not part of the pipeline: pull the published image on the
# target host (see RELEASING.md).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify version, lint & tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-only-not-a-real-secret"
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION file
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($FILE_VERSION). Bump VERSION before tagging."
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pylint (errors only)
        run: |
          pylint --rcfile=.pylintrc --errors-only \
            login/ reserve/ category/ book/

      - name: isort (check imports are sorted)
        run: isort --check-only --diff .

      - name: Run Django tests
        run: python manage.py test --verbosity=2

  docker:
    name: Build & push image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates the OCI labels (org.opencontainers.image.version /
      # revision / source / created / …) stamped into the image, plus the
      # same values as manifest/index annotations — GHCR reads the package
      # page description from the index annotations, not from labels.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ needs.verify.outputs.version }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Baked into the image so the running build is identifiable in the
          # UI and at /healthz, not just from the image labels.
          build-args: |
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  github-release:
    name: Create GitHub Release
    needs: [verify, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags, needed to diff against the previous release.
          fetch-depth: 0

      - name: Build source artifact
        run: |
          git archive --format=tar.gz \
            --prefix="book_reservation-${{ needs.verify.outputs.version }}/" \
            -o "book_reservation-${{ needs.verify.outputs.version }}.tar.gz" \
            "$GITHUB_REF_NAME"

      - name: Generate changelog since previous tag
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          {
            echo "## Changes in $GITHUB_REF_NAME"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty='- %s (%h)' "$PREV_TAG..$GITHUB_REF_NAME"
              echo
              echo "**Image:** \`ghcr.io/${{ github.repository }}:$GITHUB_REF_NAME\`"
            else
              echo "First release."
              git log --no-merges --pretty='- %s (%h)' "$GITHUB_REF_NAME"
            fi
          } > changelog.md
          cat changelog.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "book_reservation-${{ needs.verify.outputs.version }}.tar.gz" \
            --title "$GITHUB_REF_NAME" \
            --notes-file changelog.md
