<div class="modal fade" id="category_modal" tabindex="-1" role="dialog" aria-labelledby="categoryModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="categoryModalLabel">
                    <i class="fas fa-tags mr-2" style="color:var(--gold);font-size:.95rem;"></i>Category
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form class="needs-validation" id="form_category" method="POST" novalidate>
                    {% csrf_token %}
                    <input type="hidden" id="category_label_id" name="id" value="">
                    <div class="form-group">
                        <label for="category_label_category">Category Name</label>
                        <input type="text" class="form-control" id="category_label_category" name="category"
                            placeholder="e.g. Science Fiction" required>
                    </div>
                    <div class="form-group mb-0">
                        <label for="category_label_description">Description</label>
                        <textarea class="form-control" id="category_label_description" name="description"
                            placeholder="Brief description of this category…" rows="3" required></textarea>
                    </div>
                    <div class="modal-footer mt-0 px-0 pb-0">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button id="category_button_form" class="btn btn-primary">Save Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
