<div class="modal fade" id="reserve_modal" tabindex="-1" role="dialog" aria-labelledby="reserveModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reserveModalLabel">
                    <i class="fas fa-book-reader mr-2" style="color:var(--gold);font-size:.95rem;"></i>Reserve a Book
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form class="needs-validation" id="form_reserve" method="POST" novalidate>
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="reserve_dni">DNI / Identifier</label>
                        <input type="text" class="form-control" id="reserve_dni"
                            name="dni" placeholder="e.g. 12345678" required>
                    </div>
                    <div class="form-group">
                        <label for="reserve_name">Full Name</label>
                        <input type="text" class="form-control" id="reserve_name"
                            name="name" placeholder="Your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="reserve_book">Book</label>
                        <select id="reserve_book" name="book" class="custom-select" required>
                            <option value="">Loading books…</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-6">
                            <label for="reserve_start_date">Start Date</label>
                            <input type="date" class="form-control" id="reserve_start_date"
                                name="start_date" required>
                        </div>
                        <div class="form-group col-6">
                            <label for="reserve_end_date">Return By</label>
                            <input type="date" class="form-control" id="reserve_end_date"
                                name="end_date" required>
                        </div>
                    </div>
                    <div class="modal-footer mt-0 px-0 pb-0">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check mr-1"></i> Confirm Reservation
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
