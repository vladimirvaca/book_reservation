<div class="modal fade" id="book_modal" tabindex="-1" role="dialog" aria-labelledby="bookModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="bookModalLabel">
                    <i class="fas fa-book mr-2" style="color:var(--gold);font-size:.95rem;"></i>Book
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form class="needs-validation" id="form_book" method="POST" novalidate>
                    {% csrf_token %}
                    <input type="hidden" id="book_label_id" name="id" value="">
                    <div class="form-group">
                        <label for="category_label_serial_number">Serial Number</label>
                        <input type="text" class="form-control" id="category_label_serial_number"
                            name="number_serie" placeholder="e.g. 0123456789" required>
                    </div>
                    <div class="form-group">
                        <label for="book_label_name">Book Title</label>
                        <input type="text" class="form-control" id="book_label_name"
                            name="name" placeholder="Name of the book…" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" class="form-control form-control-sm mb-2"
                            id="search_label_category" placeholder="Search category…">
                        <select id="select_category" name="category_book" class="custom-select">
                            <option selected>Search and select a category</option>
                        </select>
                    </div>
                    <div class="form-group mb-0">
                        <label for="book_label_resume">Resume</label>
                        <input type="text" class="form-control" id="book_label_resume"
                            name="resume" placeholder="Brief description of the book…" required>
                    </div>
                    <div class="modal-footer mt-0 px-0 pb-0">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button id="book_button_form" class="btn btn-primary">Save Book</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
