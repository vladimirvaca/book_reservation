{% load static %}
<!doctype html>
<!-- Data attributes make the running build readable from devtools and from JS
     (see utilities.js), without parsing the page. -->
<html lang="en" data-app-version="{{ app_version }}" data-app-revision="{{ app_revision }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#1a1611">

    <!-- Deployed build identification (visible in "view source" / curl). -->
    <meta name="application-name" content="Book Reservation">
    <meta name="version" content="{{ app_release }}">
    {% if app_revision %}<meta name="revision" content="{{ app_revision }}">{% endif %}

    <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/library.ico' %}" />

    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.19/css/dataTables.bootstrap4.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.2.3/css/responsive.bootstrap4.min.css" />

    <!-- FontAwesome 5 -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css" />

    <!-- Global design tokens + fonts -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />

    {% block css %}{% endblock css %}

    <title>{% block title %}Book Reservation{% endblock %} · {{ app_release }}</title>
</head>
<body>
    {% block content %}{% endblock content %}

    <!-- jQuery 3.7.1 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 4 JS -->
    <script src="{% static 'js/bootstrap/bootstrap.min.js' %}"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.10.19/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.19/js/dataTables.bootstrap4.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.3/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.3/js/responsive.bootstrap4.min.js"></script>
    <!-- Shared utilities -->
    <script src="{% static 'js/utilities.js' %}"></script>

    {% block js %}{% endblock js %}
</body>
</html>
